name: dotnet project
on:
  push:
    branches:
      - develop
jobs:
  dotnet-publish:
    runs-on: 'ubuntu-latest'
    steps:
      - name: code checkout
        uses: actions/checkout@v5
      - name: sonarqube cloud integration
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          mysonartoken: ${{ secrets.SONAR_TOKEN }}
        with:
        arg: >
          -Dsonar.projectKey=Deepthichintha_nopCommerce
          -Dsonar.organization=deepthichintha
          -Dsonar.host.url=https://sonarcloud.io
      - name: this is my dotnet project
        run: dotnet publish -c release src/Presentation/Nop.Web/Nop.Web.csproj -o demo
