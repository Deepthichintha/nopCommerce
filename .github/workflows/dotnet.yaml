on:
  push:
    branches:
      - develop

jobs:
  dotnet-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Deepthichintha_nopCommerce
            -Dsonar.organization=deepthichintha
            -Dsonar.host.url=https://sonarcloud.io

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.100"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: ECR Login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 248703573306.dkr.ecr.us-east-1.amazonaws.com
          docker build -t nopcommerce .
          docker tag nopcommerce:latest 248703573306.dkr.ecr.us-east-1.amazonaws.com/nopcommerce:latest
          docker push 248703573306.dkr.ecr.us-east-1.amazonaws.com/nopcommerce:latest

      - name: Publish .NET Project
        run: dotnet publish -c Release src/Presentation/Nop.Web/Nop.Web.csproj -o demo
