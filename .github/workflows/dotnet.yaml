name: .NET Build and Publish (Self-Hosted)

on:
  push:
    branches: [ "develop" ]

jobs:
  build:
    name: Build
    runs-on: self-hosted  # 👈 uses your own runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Publish project
        run: dotnet publish --configuration Release  src/Presentation/Nop.Web/Nop.Web.csproj --output ./publish

      # # Optional: Upload build artifacts for later use
      # - name: Upload publish folder
